<!DOCTYPE html>
<html>
<head>
  <title>Generate SN Flow Compare Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: #e0e0e0; }
    .icon-container { display: flex; gap: 20px; margin: 20px 0; }
    canvas { background: #2d2d2d; border-radius: 8px; }
    button { padding: 10px 20px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
    button:hover { background: #005a9e; }
    h2 { margin-top: 30px; }
    .instructions { background: #2d2d2d; padding: 15px; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>SN Flow Compare - Icon Generator</h1>

  <div class="instructions">
    <p><strong>Instructions:</strong></p>
    <ol>
      <li>Open this file in your browser</li>
      <li>Click "Generate Icons" below</li>
      <li>Right-click each icon and "Save Image As" to the icons folder</li>
      <li>Save as: icon16.png, icon48.png, icon128.png</li>
    </ol>
  </div>

  <button onclick="generateIcons()">Generate Icons</button>
  <button onclick="downloadAll()">Download All</button>

  <div class="icon-container">
    <div>
      <h3>16x16</h3>
      <canvas id="icon16" width="16" height="16"></canvas>
    </div>
    <div>
      <h3>48x48</h3>
      <canvas id="icon48" width="48" height="48"></canvas>
    </div>
    <div>
      <h3>128x128</h3>
      <canvas id="icon128" width="128" height="128"></canvas>
    </div>
  </div>

  <script>
    function drawIcon(ctx, size) {
      const scale = size / 128;

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#0078d4');
      gradient.addColorStop(1, '#005a9e');

      // Draw rounded rect background
      ctx.fillStyle = gradient;
      roundRect(ctx, 0, 0, size, size, 20 * scale);
      ctx.fill();

      // Left panel
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      roundRect(ctx, 14 * scale, 24 * scale, 44 * scale, 80 * scale, 4 * scale);
      ctx.fill();

      // Right panel
      roundRect(ctx, 70 * scale, 24 * scale, 44 * scale, 80 * scale, 4 * scale);
      ctx.fill();

      // Lines on left panel
      const lines = [
        { y: 32, w: 32, color: 'rgba(0,120,212,0.6)' },
        { y: 42, w: 28, color: '#3fb950' },
        { y: 52, w: 32, color: 'rgba(0,120,212,0.6)' },
        { y: 62, w: 24, color: '#f85149' },
        { y: 72, w: 30, color: 'rgba(0,120,212,0.6)' },
        { y: 82, w: 32, color: '#d29922' },
        { y: 92, w: 26, color: 'rgba(0,120,212,0.6)' }
      ];

      lines.forEach(line => {
        ctx.fillStyle = line.color;
        roundRect(ctx, 20 * scale, line.y * scale, line.w * scale, 4 * scale, 2 * scale);
        ctx.fill();
      });

      // Lines on right panel
      const rightLines = [
        { y: 32, w: 32, color: 'rgba(0,120,212,0.6)' },
        { y: 42, w: 28, color: '#3fb950' },
        { y: 52, w: 32, color: 'rgba(0,120,212,0.6)' },
        { y: 62, w: 30, color: 'rgba(0,120,212,0.6)' },
        { y: 72, w: 30, color: 'rgba(0,120,212,0.6)' },
        { y: 82, w: 32, color: '#d29922' },
        { y: 92, w: 26, color: 'rgba(0,120,212,0.6)' }
      ];

      rightLines.forEach(line => {
        ctx.fillStyle = line.color;
        roundRect(ctx, 76 * scale, line.y * scale, line.w * scale, 4 * scale, 2 * scale);
        ctx.fill();
      });

      // Arrow
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3 * scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(60 * scale, 54 * scale);
      ctx.lineTo(68 * scale, 64 * scale);
      ctx.lineTo(60 * scale, 74 * scale);
      ctx.stroke();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function generateIcons() {
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById('icon' + size);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        drawIcon(ctx, size);
      });
    }

    function downloadAll() {
      generateIcons();
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById('icon' + size);
        const link = document.createElement('a');
        link.download = 'icon' + size + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // Generate on load
    window.onload = generateIcons;
  </script>
</body>
</html>
