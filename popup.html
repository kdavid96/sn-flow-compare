<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SN Flow Compare</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
    }

    .popup-container {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #3c3c3c;
    }

    .header img {
      width: 32px;
      height: 32px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #808080;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .shortcut-display {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #2d2d2d;
      border-radius: 6px;
    }

    .key {
      display: inline-block;
      padding: 4px 8px;
      background: #3c3c3c;
      border: 1px solid #4c4c4c;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }

    .plus {
      color: #808080;
    }

    .instructions {
      font-size: 13px;
      line-height: 1.5;
      color: #a0a0a0;
    }

    .instructions ol {
      margin-left: 16px;
      margin-top: 8px;
    }

    .instructions li {
      margin-bottom: 6px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #2d2d2d;
      border-radius: 6px;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
    }

    .status-dot.inactive {
      background: #808080;
    }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #3c3c3c;
      text-align: center;
    }

    .footer a {
      color: #0078d4;
      text-decoration: none;
      font-size: 12px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .version {
      font-size: 11px;
      color: #808080;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="icons/icon48.png" alt="SN Flow Compare">
      <h1>SN Flow Compare</h1>
    </div>

    <div class="section">
      <div class="section-title">Keyboard Shortcut</div>
      <div class="shortcut-display">
        <span class="key">Alt</span>
        <span class="plus">+</span>
        <span class="key">Shift</span>
        <span class="plus">+</span>
        <span class="key">C</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">How to Use</div>
      <div class="instructions">
        <ol>
          <li>Open a flow in <strong>Flow Designer</strong> or <strong>Workflow Studio</strong></li>
          <li>Press <strong>Alt+Shift+C</strong> to open the comparison view</li>
          <li>Select versions to compare using the dropdowns</li>
        </ol>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Status</div>
      <div class="status" id="status">
        <span class="status-dot inactive" id="statusDot"></span>
        <span id="statusText">Not on ServiceNow</span>
      </div>
    </div>

    <div class="footer">
      <a href="https://github.com" target="_blank">Report Issue</a>
      <div class="version">v1.0.0</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
